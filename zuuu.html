<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuuStoree - Pusat Item & Quest Roblox GAG2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-indigo-500/20 p-6 rounded-3xl text-center shadow-2xl shadow-indigo-950/50 my-6">
        <!-- Logo Header -->
        <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-indigo-600/40">
            <i class="fa-solid fa-store"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight mb-1 text-white">ZuuStoree</h1>
        <p class="text-xs text-indigo-300 font-medium mb-6">Pusat Item & Quest Roblox GAG2 Terpercaya</p>
        
        <!-- QR Code Section -->
        <div class="mb-6 bg-slate-950/80 p-4 rounded-2xl border border-emerald-500/30">
            <p class="text-xs font-semibold text-emerald-400 mb-3 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-qrcode"></i> Scan QR Pembayaran / Promo
            </p>
            <div class="overflow-hidden rounded-xl border border-slate-800 shadow-md">
                <img src="https://i.ibb.co.com/84c3n58w/219832.jpg" alt="QR ZuuStoree" class="w-full h-auto object-cover hover:scale-105 transition-transform duration-300">
            </div>
            <p class="text-[10px] text-slate-400 mt-2">Scan QR di atas untuk transaksi / pembayaran cepat</p>
        </div>

        <!-- Daftar Produk -->
        <div class="space-y-3 mb-6 text-left text-xs bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
            <div class="flex justify-between items-center py-1">
                <span class="font-medium text-slate-300"><i class="fa-solid fa-box-open text-sky-400 mr-2"></i>Semua Layanan / Item</span>
                <span class="font-bold text-sky-400 bg-sky-500/10 px-2.5 py-1 rounded-lg">Rp 1.000 - Rp 50.000</span>
            </div>

            <div class="pt-3 mt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                <span>Pembayaran DANA:</span>
                <strong class="text-white bg-slate-900 px-2 py-0.5 rounded border border-slate-800">0822-5685-2654</strong>
            </div>
        </div>

        <!-- Tombol Aksi WhatsApp -->
        <a href="https://wa.me/6282256852654?text=Halo%20ZuuStoree,%20saya%20mau%20order%20ke%20WA" target="_blank" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
            <i class="fa-brands fa-whatsapp text-base"></i> Order ke WA Sekarang
        </a>
        
        <p class="text-[10px] text-slate-500 mt-5">© 2026 ZuuStoree. Fast, Safe & Trusted.</p>
    </div>
</body>
</html>
